name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test
        shell: cmd
        run: build.bat

      - name: Verify and package release files
        shell: pwsh
        run: |
          $expected = ((Get-Content dist\ChaChing.exe.sha256 -Raw).Trim() -split "\s+")[0]
          $actual = (Get-FileHash dist\ChaChing.exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw "ChaChing.exe checksum verification failed"
          }
          Compress-Archive `
            -Path dist\ChaChing.exe, dist\ChaChing.exe.sha256 `
            -DestinationPath dist\ChaChing-windows.zip

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ChaChing-windows
          path: dist/ChaChing-windows.zip
          if-no-files-found: error
          retention-days: 7
