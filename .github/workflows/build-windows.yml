name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test
        shell: cmd
        run: build.bat

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ChaChing-v1.3.0-windows
          path: |
            dist/ChaChing.exe
            dist/ChaChing.exe.sha256
          if-no-files-found: error
          retention-days: 7
